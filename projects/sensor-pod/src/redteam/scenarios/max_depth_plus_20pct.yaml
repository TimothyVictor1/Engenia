name: max_depth_plus_20pct
rationale: The pod is lowered 20 % deeper than its rated depth, through a mis-set
  winch counter or a drifting mooring. The hull must still hold its stress safety
  factor and the walls must stay at their minimum, because a seal fails when the tube
  or cap yields. The structure solver scales the design-depth stress by the pressure
  ratio and the pod sizing uses the same depth.
