name: ice_loading
rationale: Freezing spray coats the antenna and the arm. Ice adds mass at the load
  point and stiffens the lever; a 1.5 factor on the load is an allowance for it (an
  assumption, not an icing calculation). The arm must still hold its bending safety
  factor, and the section must stay at the printed wall minimum.
