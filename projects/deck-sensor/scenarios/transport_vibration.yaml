extra: {vibration_g_rms: 2.0, road_transport_hours: 8.0}
rationale: Road transport to the installation site, 2 g rms broadband vibration for a full
  working day. The vibration sensing channel must still separate the reference vibration
  tone from transport noise at the required detection rate. The wave fields are unused for
  a deck-mounted box and are kept at zero immersion because the scenario model requires them.
