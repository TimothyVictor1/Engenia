rationale: Driving rain and a salt-water deck washdown at 150 mm/h against the gasketed lid.
  The 3 mm minimum wall and the seal are the only barrier between the spray and the
  electronics, so the enclosure minimums must hold. The wave fields are unused for a
  deck-mounted box and are kept at zero immersion because the scenario model requires them.
