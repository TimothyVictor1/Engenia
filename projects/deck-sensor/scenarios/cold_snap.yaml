name: cold_snap
water_temp_c: -20.0
extra: {air_temp_c: -20.0}
rationale: Winter night on an exposed deck at -20 C. Lithium-polymer capacity drops sharply
  at low temperature, so the endurance minimum must still hold, and the printed enclosure
  must not crack. Without wave or water fields, a deck-mounted box does not float, so the wave
  and flow solvers skip this scenario.
targets: [R-003]
