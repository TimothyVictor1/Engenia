depth_m: null
extra:
  clearance_shift_mm: 0.1
  grain_mm: 1.0
name: debris_and_swell
rationale: Sand and weed pass the blade tips, and printed PETG takes up water and
  swells inward. A 0.1 mm inward shift of the throat is an allowance for it (an assumption,
  not a moisture measurement). The tip clearance must stay at or above its minimum
  after the shift, so the blade cannot bind, and at or below its maximum without it,
  so the duct still works. The pack aims the clearance for it and the prop_clearance
  verifier applies the same shift.
targets:
- R-001
- R-004
water_density: null
water_temp_c: 8.0
wave_height_m: null
wave_period_s: null
