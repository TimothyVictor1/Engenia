# Electronics catalogue for the pressure_housing pack: the sensor pod's hydrophone channel,
# an environment sensor that watches the cavity for leaks, the MCU, regulator and a battery.
# Every part is the datasheet-backed entry the buoy or enclosure pack already carries; only the
# design profile (duty cycle, board size) is the pod's own. See README.md for the limits.
[design]
duty_cycle = { sample = 0.003, transmit = 0.0, sleep = 0.997 }
# The hydrophone channel stays powered to catch events, the MCU sleeps between them, and the
# environment sensor is read once per sample burst. There is no radio: a sealed pod logs to
# flash and is read out when it is recovered.
active_modes = { microcontroller = ["sample"], audio = ["sample", "transmit", "sleep"], environment_sensor = ["sample"] }
regulator_efficiency = 0.85
usable_capacity_fraction = 0.8
board_mm = [60.0, 32.0, 8.0]
support_mass_g = 8.0
support_current_ma = 0.2
assembly_clearance_mm = 2.0
source = "Engenia pressure-housing electronics design assumptions, README.md p. 1: duty fractions, a 60 mm sensor carrier board, support mass/current, clearance, efficiency and usable-capacity derating; these are design allowances, not vendor specifications."

