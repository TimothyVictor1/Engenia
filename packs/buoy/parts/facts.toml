# Approved for this sprint's analytical design. See README.md for source URLs,
# operating conditions, derived allowances, and limitations (not lab measurements).
[design]
duty_cycle = { sample = 0.003, transmit = 0.0005, sleep = 0.9965 }
regulator_efficiency = 0.85
usable_capacity_fraction = 0.8
board_mm = [70.0, 40.0, 8.0]
support_mass_g = 12.0
