# Bracket product pack: printed PETG mounting brackets, a mast clamp with a cantilever arm and
# an L-bracket for a wall. A project selects it with `pack: bracket` in projects/<p>/project.yaml.
# A bracket has no electronics and no firmware, so the pack skips both stages.
materials: {PETG: {density_g_cm3: 1.27}}
# Infill 1.0 means solid walls.
printing: {infill_factor: 1.0, bed_mm: [220, 220, 250]}
skip_stages: [electronics, firmware]
templates:
  bracket:
    module: packs.bracket.templates.bracket
    checks: [mass_budget, print_bed_fit, wall_thickness_min, bending_stress]
# Material for the bending_stress verifier: allowable = allowable_stress x printed_knock_down.
structure:
  youngs_modulus_mpa: 2100  # Assumption: representative printed PETG elastic modulus.
  poisson_ratio: 0.38  # Assumption: isotropic PETG Poisson ratio.
  allowable_stress_mpa: 35  # Assumption: PETG yield-based allowable stress.
  printed_knock_down_factor: 0.60  # Assumption: reduction for layer bonding and defects.
# Rules the deterministic proposer sizes from. Every number is a rule, not a dimension: the
# dimensions come out of the requirement's load and the contract's budgets.
bracket:
  min_wall_mm: 3.2  # eight perimeter lines of a 0.4 mm nozzle; the thinnest section printed.
  step_mm: 0.4  # dimensions are rounded up to a whole nozzle line width.
  stress_margin: 1.15  # on top of the requirement's safety factor, for the printed layers.
  fillet_mm: 2.0  # largest fillet at every inside corner; reduced to fit a thin section.
  mount:
    bolt_mm: 4.0  # M4 antenna / wall bolts
    hole_mm: 4.5  # clearance hole for the bolt
    pitch_mm: 30.0  # square pattern of four holes in the arm plate
    edge_ratio: 1.5  # material from a hole to the plate edge, as a multiple of the hole
  clamp:
    fit_clearance_mm: 0.4  # printed bore over the mast diameter
    height_ratio: 0.5  # clamp height as a multiple of the mast diameter
    min_height_mm: 20.0
    slit_mm: 2.0  # gap that lets the split ring close on the mast
    ear_length_mm: 12.0  # how far the clamp ears stand out of the ring
    bolt_hole_mm: 4.5  # M4 clamp bolt clearance
    bolt_mass_g: 4.0  # allowance for an M4 screw and nut; not a vendor figure.
  arm:
    max_aspect: 4.0  # arm depth over width; a taller arm would twist before it bends
  shelf:
    width_mm: 30.0  # L-bracket leg width
    base_height_mm: 40.0  # wall leg height
