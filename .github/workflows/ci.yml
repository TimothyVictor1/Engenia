name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y libglu1-mesa libgl1 libxrender1 libxext6 libxcursor1 libxft2 libxinerama1
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pytest -q -m "not slow"

  slow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y libglu1-mesa libgl1 libxrender1 libxext6 libxcursor1 libxft2 libxinerama1
      - run: uv sync
      - run: uv run pytest -q -m slow
      - name: Run harbour-listener pipeline
        run: |
          if uv run engenia run harbour-listener; then
            exit 0
          else
            pipeline_status=$?
          fi
          gate_report=projects/harbour-listener/build/gate/report.json
          if [ -f "$gate_report" ]; then
            cat "$gate_report"
          else
            printf '%s\n' "No gate report was produced: $gate_report"
          fi
          exit "$pipeline_status"
