[project]
name = "engenia"
version = "0.1.0"
description = "Engenia: from a written product request to a verified design."
requires-python = ">=3.12"
dependencies = [
    "build123d==0.12.0",
    "pydantic>=2",
    "typer",
    "pyyaml",
    "pytest",
    "ruff",
    "httpx",
    "fastapi",
    "uvicorn",
    "skidl==2.2.3",
    "tomli-w>=1.2,<2",
    "platformio==6.1.18",
    "numpy>=2,<3",
    "capytaine>=3.0.0",
    "gmsh>=4.15,<5",
    "scikit-fem>=11,<12",
    "meshio>=5.3,<6",
]

[project.scripts]
engenia = "engenia.core.cli:app"

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "engenia"
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
markers = [
    "slow: runs CAD, meshing or the full pipeline (CI runs these in a separate job)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
